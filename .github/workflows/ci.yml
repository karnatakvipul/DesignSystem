name: CI

# Every push and every pull request. The two defects that shipped into this
# repo — a bundle that could not be imported, and a publish gate demanding a
# theme that never existed — were both already detectable by scripts sitting in
# package.json. Nothing ran them.
on:
  push:
  pull_request:
  workflow_dispatch:

# A new push to the same branch makes the previous run's answer irrelevant.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Verify (Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      # Both versions run even if one fails — "broken on 22, fine on 20" is the
      # useful answer, and fail-fast throws it away.
      fail-fast: false
      matrix:
        # package.json claims engines >= 18, but Node 18 left security support
        # in April 2025 and this toolchain (Vite 6, Vitest 4) no longer targets
        # it. Worth either testing 18 here or lowering the claim — see the note
        # in CONTRIBUTING.md.
        node: ["20.x", "22.x"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      # `ci`, not `install`: installs exactly the lockfile, and fails if
      # package.json and the lockfile disagree.
      - name: Install
        run: npm ci

      - name: Lint
        run: npm run lint:ci

      - name: Test
        run: npm test

      - name: Build
        run: npm run build

      # Checks the built output rather than the source: every public export
      # reachable, every theme complete, no dependency bundled in, and a
      # component that actually renders.
      - name: Verify package
        run: npm run verify:package

  consumable:
    name: Install from a tarball and render
    runs-on: ubuntu-latest

    # The check that would have caught the broken bundle from the outside.
    # `verify:package` reads dist/ in place, with the repo's own node_modules
    # sitting next to it; this packs the tarball npm would publish, installs it
    # into a project that has never seen this repo, and renders from it. A
    # missing `files` entry or a dependency that only resolved because it
    # happened to be present locally shows up here and nowhere else.
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22.x"
          cache: npm

      - name: Install
        run: npm ci

      - name: Build
        run: npm run build

      - name: Pack
        run: npm pack --pack-destination /tmp

      - name: Install into a fresh project and render
        run: node scripts/verify-tarball.mjs /tmp
